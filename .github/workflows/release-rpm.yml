name: Release .rpm

on:
  release:
    types: [published]
  workflow_dispatch:

# The build job can only read. Writing to the release, and the provenance
# attestation, happen in a second job that never runs the build tools.
# Actions are pinned to commit SHAs (the tag is in the comment), and the
# Fedora image to a digest.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:3d020c33fbb50af70acaf673e0e6cad94ccef310e9fce6856112e077a5402117
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build rpmlint git-core dotnet-sdk-10.0 systemd-rpm-macros \
            gcc gcc-c++ make pkgconf-pkg-config pipewire-devel lilv-devel lv2-devel libX11-devel libsndfile-devel \
            cargo rust

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions agree everywhere
        run: tools/check-version.sh

      - name: Run tests
        run: |
          dotnet restore src/OpenXLR.slnx --locked-mode
          dotnet build src/OpenXLR.slnx -c Release --no-restore -warnaserror
          dotnet test src/OpenXLR.slnx -c Release --no-build

      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VER=$(rpmspec -q --srpm --qf '%{version}' packaging/rpm/openxlr.spec)
          mkdir -p rpmbuild/SOURCES dist
          git archive --format=tar.gz --prefix="openxlr-$VER/" \
            -o "rpmbuild/SOURCES/openxlr-$VER.tar.gz" HEAD
          # Source1, DeepFilterNet's model, is fetched from its URL; the
          # native build checks its SHA-256.
          rpmbuild --define "_topdir $PWD/rpmbuild" --undefine=_disable_source_fetch \
            -bb packaging/rpm/openxlr.spec
          mv rpmbuild/RPMS/x86_64/openxlr-*.rpm dist/

      # packaging/rpm/rpmlint.toml lists the findings that were reviewed and
      # are not defects, each with its reason; any other error fails the build.
      - name: Lint package
        run: rpmlint --config packaging/rpm/rpmlint.toml dist/openxlr-*.rpm

      - name: Install check
        run: |
          dnf install -y ./dist/openxlr-*.rpm
          rpm -q openxlr
          test -x /usr/bin/openxlr && test -x /usr/bin/openxlr-daemon
          test -x /usr/lib/openxlr/daemon/OpenXLR.Daemon
          test -x /usr/lib/openxlr/daemon/openxlr-lv2-host
          /usr/lib/openxlr/daemon/openxlr-lv2-host engines | tee engines.json
          grep -q '"deepfilternet"' engines.json
          test -f /usr/share/licenses/openxlr/rnnoise/COPYING
          test -f /usr/share/licenses/openxlr/deepfilter/LICENSE-MIT
          test -f /usr/lib/udev/rules.d/70-openxlr.rules
          test -f /usr/share/wireplumber/wireplumber.conf.d/50-xlr-dock-capture-hold.conf
          test -f /usr/share/wireplumber/wireplumber.conf.d/52-openxlr-mk1-capture-hold.conf
          test -f /usr/share/wireplumber/wireplumber.conf.d/53-openxlr-wave3-capture-hold.conf
          test -f /usr/lib/systemd/user/openxlr-daemon.service
          test -f /usr/lib/systemd/user/pipewire-pulse.service.d/openxlr.conf

      - name: Checksums
        run: cd dist && sha256sum openxlr-*.rpm > SHA256SUMS-rpm.txt && cat SHA256SUMS-rpm.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openxlr-rpm
          path: |
            dist/*.rpm
            dist/SHA256SUMS-rpm.txt

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openxlr-rpm
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.rpm

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.rpm dist/SHA256SUMS-rpm.txt --repo "$REPO"
