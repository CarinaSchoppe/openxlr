# Elgato XLR Dock: its capture stream must be running before any playback
# stream opens, or the kernel starves the capture endpoint and the mic
# delivers pure silence (Linux full-duplex ordering bug, works on Windows).
# Keep the capture source from ever suspending so it always starts first.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input\\.usb-Elgato_Systems_Elgato_XLR_Dock.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
      }
    }
  }
]
