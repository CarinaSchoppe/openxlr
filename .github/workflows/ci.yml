name: CI

on:
  push:
    branches: [main, development]
  pull_request:

# Actions are pinned to commit SHAs (the tag is in the comment) so a moved
# tag upstream cannot change what runs here.
permissions:
  contents: read

jobs:
  omarchy-qml:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install QML check tools
        run: pacman -Syu --noconfirm git python qt6-declarative qt6-websockets ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Omarchy QML with external type declarations
        run: python3 tools/check-omarchy.py
      - name: Check the generated Omarchy meter palettes
        run: python3 tools/omarchy-skins.py --check
      - name: Exercise Omarchy strip controls with a fake daemon
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input packaging/omarchy/tests

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Versions agree everywhere
        run: tools/check-version.sh

      - name: Restore (locked to packages.lock.json)
        run: dotnet restore src/OpenXLR.slnx --locked-mode

      - name: Build
        run: dotnet build src/OpenXLR.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test src/OpenXLR.slnx -c Release --no-build

      - name: Validate Stream Deck/OpenDeck plugin
        run: |
          python3 tools/deck-skins.py --check
          node --check plugin/com.emaspa.openxlr.sdPlugin/plugin.mjs
          python3 -m json.tool plugin/com.emaspa.openxlr.sdPlugin/manifest.json >/dev/null
          python3 tools/check-openapi.py docs/openapi-v1.json
          node --test plugin/tests/*.test.mjs
          node --test packaging/omarchy/tests/*.test.mjs
          python3 -m json.tool packaging/omarchy/openxlr.mixer/manifest.json >/dev/null

      - name: Optional native LV2 host compiles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pipewire pipewire-pulse wireplumber pulseaudio-utils swh-plugins lsp-plugins-lv2 g++ libpipewire-0.3-dev liblilv-dev lv2-dev libx11-dev libxtst6 xvfb xauth fonts-noto-core fonts-noto-cjk
          make -C native
          make -C native tests/latency.lv2/latency.so

          make -C native tests/gain.lv2/gain.so
          dotnet build src/OpenXLR.slnx -c Release --no-restore -warnaserror -p:EnableNativeLv2Host=true
          test -x native/openxlr-lv2-host
          make -C native test-audio test-clap test-vst3 test-scan test-sound-check
          xvfb-run -a make -C native test-editor

      - name: LV2 catalogue metadata with lilv installed
        run: dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~Lv2BundleTests|FullyQualifiedName~PluginSearchPathTests"

      - name: Desktop monitor volume controls
        run: LV2_PATH="$PWD/native/tests" python3 tools/test-monitor-volume.py

      - name: Software ClipGuard audio with a native LV2 insert
        run: OPENXLR_TEST_DSP=1 OPENXLR_TEST_FILTER=FullyQualifiedName~DspAudioIntegrationTests LV2_PATH=/usr/lib/lv2 python3 tools/test-monitor-volume.py

      - name: Tray window lifecycle
        run: OPENXLR_TEST_DESKTOP=1 xvfb-run -a dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~TrayWindowTests

      - name: Lint shell scripts
        run: shellcheck --severity=error tools/check-version.sh tools/check-locked-restore.sh packaging/ppa/make-source.sh packaging/omarchy/openxlr-omarchy-enable

      - name: Window layout and script rendering in every shipped language
        run: |
          for language in en de es fr zh-Hans zh-Hant hi ar bn pt id ur ru ja pcm; do
            printf 'Checking window layout with language %s\n' "$language"
            OPENXLR_LANGUAGE="$language" OPENXLR_TEST_LAYOUT=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~WindowLayoutTests
          done

      - name: Window startup follows saved language and system locale
        run: |
          while read -r startup_locale preference launch_override expected; do
            printf 'Checking startup: locale=%s preference=%s override=%s expected=%s\n' "$startup_locale" "$preference" "$launch_override" "$expected"
            settings=("LANG=$startup_locale" "LC_ALL=$startup_locale" "OPENXLR_TEST_LANGUAGE_PREFERENCE=$preference" "OPENXLR_TEST_EXPECT_LANGUAGE=$expected" "OPENXLR_TEST_LAYOUT=1")
            if [ "$launch_override" = empty ]; then
              settings+=("OPENXLR_LANGUAGE=")
            elif [ "$launch_override" != none ]; then
              settings+=("OPENXLR_LANGUAGE=$launch_override")
            fi
            env -u OPENXLR_LANGUAGE "${settings[@]}" xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~WindowLayoutTests
          done <<'CASES'
          de_DE.UTF-8 system none de
          es_MX.UTF-8 system none es
          fr_CA.UTF-8 system none fr
          it_IT.UTF-8 system none en
          zh_CN.UTF-8 system none zh-Hans
          zh_TW.UTF-8 system none zh-Hant
          zh_HK.UTF-8 system none zh-Hant
          hi_IN.UTF-8 system none hi
          ar_EG.UTF-8 system none ar
          bn_BD.UTF-8 system none bn
          pt_BR.UTF-8 system none pt
          pt_PT.UTF-8 system none pt
          id_ID.UTF-8 system none id
          ur_PK.UTF-8 system none ur
          ru_RU.UTF-8 system none ru
          ja_JP.UTF-8 system none ja
          pcm_NG.UTF-8 system none pcm
          de_DE.UTF-8 en none en
          en_US.UTF-8 de none de
          en_US.UTF-8 es none es
          en_US.UTF-8 fr none fr
          de_DE.UTF-8 fr en en
          de_DE.UTF-8 fr system de
          de_DE.UTF-8 fr empty fr
          en_US.UTF-8 zh-CHT none zh-Hant
          en_US.UTF-8 zh-CHS none zh-Hans
          en_US.UTF-8 system zh-CHT zh-Hant
          en_US.UTF-8 system zh-CHS zh-Hans
          en_US.UTF-8 de-AT none de
          de_DE.UTF-8 ../../de none en
          CASES
          env -u OPENXLR_LANGUAGE -u LC_ALL LANG=en_US.UTF-8 LC_MESSAGES=de_DE.UTF-8 OPENXLR_TEST_LANGUAGE_PREFERENCE=system OPENXLR_TEST_EXPECT_LANGUAGE=de OPENXLR_TEST_LAYOUT=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~WindowLayoutTests
          env -u OPENXLR_LANGUAGE -u LC_ALL -u LC_MESSAGES LANG=es_MX.UTF-8 OPENXLR_TEST_LANGUAGE_PREFERENCE=system OPENXLR_TEST_EXPECT_LANGUAGE=es OPENXLR_TEST_LAYOUT=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~WindowLayoutTests

      - name: Window tile ordering preserves controls and skins
        run: OPENXLR_TEST_ORDER=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~WindowOrderTests

      - name: A tooltip at a screen edge does not take the click
        run: OPENXLR_TEST_TOOLTIP=1 xvfb-run -a -s '-screen 0 1600x1000x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ToolTipInputTests

      - name: Skins reach every window and the default comes back
        run: OPENXLR_TEST_SKIN=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~SkinWindowTests

      - name: Arabic text stays usable with every skin at 150 percent scale
        run: OPENXLR_LANGUAGE=ar AVALONIA_GLOBAL_SCALE_FACTOR=1.5 OPENXLR_TEST_SKIN=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~SkinWindowTests

      - name: Locked restore enforced on every packaging path
        run: tools/check-locked-restore.sh

      - name: RPM recipe claims every file it installs
        run: tools/check-spec.py packaging/rpm/openxlr.spec

      - name: Validate packaged service inputs
        run: |
          test -f packaging/openxlr-daemon.service
          test -f packaging/70-openxlr.rules
          grep -q '0fd9' packaging/70-openxlr.rules
