# Elgato Wave:3 (0fd9:0070): the same full-duplex ordering bug as the XLR
# Dock (see 50-xlr-dock-capture-hold.conf) and the original Wave XLR (see
# 52-openxlr-mk1-capture-hold.conf), confirmed on an owner's unit (bcdDevice
# 1.22, full speed on a root port of an AMD xHCI controller). After some
# boots the mic delivered bit-exact zeros while the stream looked normal.
# Opening capture before any playback made it work until the idle suspend
# closed the capture and a later reopen came after playback again.
# Restarting the OpenXLR daemon did not bring the sound back; a replug did.
# The same props kept the mic working on that unit across several reboots.
# The maintainer's unit, behind a hub, has not shown the bug; as on the
# Dock, the port and the controller seem to decide whether it shows.
# Same fix as the Dock: never let the capture node suspend, so it is always
# the one already running when anything else opens playback on the device.
# Elgato Wave:3 MK.2 (0fd9:00ca): a high-speed unit on the Wave XLR MK.2's
# platform, with the same kind of ordering trouble on the maintainer's unit.
# After its playback opened first, its capture stayed at Status: Stop in
# /proc/asound while PipeWire reported the source running, or ran and
# delivered a steady buzz instead of the voice. A USB reset followed by
# capture before playback cleared it. The same props keep its capture
# running before anything opens its headphones.
# The matches are the two product strings; the Wave:1 (Elgato_Wave_1_) and
# the Wave XLR models carry other names and are not touched.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input\\.usb-Elgato_Systems_Elgato_Wave_3_.*" }
      { node.name = "~alsa_input\\.usb-Elgato_Elgato_Wave_3_MK\\.2_.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
      }
    }
  }
]
