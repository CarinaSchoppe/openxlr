# Elgato Wave XLR Pro (0fd9:00b4), 17-channel playback / 18-channel
# capture, both 48 kHz float.
#
# Channel map, measured on hardware by the OpenXLR project: playback
# pairs 2/3, 10/11, 12/13 and 14/15 feed the device's hardware monitor
# bus (headphones / line out, per the device's own output routing);
# pair 2/3 is the primary one. Capture pair 0 carries XLR input 1,
# pair 1 carries XLR input 2.

Macro [
	{
		SplitPCM {
			Name "wavexlrpro_out"
			Direction Playback
			Format FLOAT_LE
			Channels 2
			HWChannels 17
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
			HWChannelPos14 FL
			HWChannelPos15 FR
			HWChannelPos16 FC
		}
	}
	{
		SplitPCM {
			Name "wavexlrpro_mono_in"
			Direction Capture
			Format FLOAT_LE
			Channels 1
			HWChannels 18
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
			HWChannelPos4 MONO
			HWChannelPos5 MONO
			HWChannelPos6 MONO
			HWChannelPos7 MONO
			HWChannelPos8 MONO
			HWChannelPos9 MONO
			HWChannelPos10 MONO
			HWChannelPos11 MONO
			HWChannelPos12 MONO
			HWChannelPos13 MONO
			HWChannelPos14 MONO
			HWChannelPos15 MONO
			HWChannelPos16 MONO
			HWChannelPos17 MONO
		}
	}
]

SectionDevice."Headphones" {
	Comment "Monitor (headphones / line out)"

	Value {
		PlaybackPriority 400
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "wavexlrpro_out"
		Direction Playback
		HWChannels 17
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line1" {
	Comment "Monitor mix feed B"

	Value {
		PlaybackPriority 300
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "wavexlrpro_out"
		Direction Playback
		HWChannels 17
		Channels 2
		Channel0 10
		Channel1 11
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Monitor mix feed C"

	Value {
		PlaybackPriority 200
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "wavexlrpro_out"
		Direction Playback
		HWChannels 17
		Channels 2
		Channel0 12
		Channel1 13
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line3" {
	Comment "Monitor mix feed D"

	Value {
		PlaybackPriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "wavexlrpro_out"
		Direction Playback
		HWChannels 17
		Channels 2
		Channel0 14
		Channel1 15
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Mic1" {
	Comment "XLR 1"

	Value {
		CapturePriority 400
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "wavexlrpro_mono_in"
		Direction Capture
		HWChannels 18
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Mic2" {
	Comment "XLR 2"

	Value {
		CapturePriority 300
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "wavexlrpro_mono_in"
		Direction Capture
		HWChannels 18
		Channels 1
		Channel0 2
		ChannelPos0 MONO
	}
}
