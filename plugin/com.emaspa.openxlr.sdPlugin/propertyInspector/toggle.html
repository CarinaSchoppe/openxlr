<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="pi.css"></head>
<body data-kind="toggle">
  <header><span class="mark">OX</span><div><strong>Mixer key</strong><small>Live toggle and routing control</small></div><span id="status" class="status waiting">Connecting</span></header>
  <section class="card">
    <label for="target">Control</label>
    <select id="target">
      <option value="">Choose a control…</option>
      <optgroup label="Wave hardware">
        <option value="mute">XLR 1 mute</option><option value="mute2">XLR 2 mute</option>
        <option value="phantom">XLR 1 phantom power</option><option value="phantom2">XLR 2 phantom power</option>
        <option value="lowCut">XLR 1 low cut</option><option value="lowCut2">XLR 2 low cut</option>
        <option value="expander">XLR 1 expander</option><option value="expander2">XLR 2 expander</option>
        <option value="voiceTune">XLR 1 voice tune</option><option value="voiceTune2">XLR 2 voice tune</option>
        <option value="clipGuard">XLR 1 ClipGuard</option><option value="clipGuard2">XLR 2 ClipGuard</option>
        <option value="compressor">XLR 1 compressor</option><option value="compressor2">XLR 2 compressor</option>
        <option value="lowImpedance">Low impedance headphones</option>
        <option value="auxLevelLock">Aux input level lock</option><option value="gainLocked">Gain lock</option>
      </optgroup>
      <optgroup label="Software processing">
        <option value="softLowCut">Low cut (Off / 80 / 120 Hz)</option>
        <option value="softClipGuard">Software ClipGuard</option>
      </optgroup>
      <optgroup label="Hardware output routing">
        <option value="outHp1">Headphones 1</option><option value="outHp2">Headphones 2</option>
        <option value="outLineOut">Line Out</option><option value="auxPort">Aux mix to USB Aux</option>
      </optgroup>
    </select>
    <p class="hint">Channels, mixes, monitor devices, profiles, and effects are loaded live from OpenXLR. Green routing keys are in the mix; red keys are muted or bypassed.</p>
  </section>
  <section class="card compact">
    <label for="icon">Key glyph</label>
    <select id="icon"><option value="">Automatic</option><option value="headphones">Headphones</option><option value="speaker">Speaker</option><option value="mic">Microphone</option><option value="jack">Jack</option><option value="fader">Fader</option><option value="knob">Knob</option></select>
  </section>
  <script src="pi.js"></script>
</body></html>
