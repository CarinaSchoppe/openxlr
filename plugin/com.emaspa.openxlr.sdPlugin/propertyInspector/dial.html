<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="pi.css"></head>
<body data-kind="dial">
  <header><span class="mark">OX</span><div><strong>Mixer dial</strong><small>Live level, meter, and control stack</small></div><span id="status" class="status waiting">Connecting</span></header>
  <section class="card">
    <label for="target">Add a control</label>
    <div class="add-row"><select id="target"><option value="">Choose a level…</option><optgroup label="Wave hardware"><option value="outputVolume">Monitored output volume</option><option value="gain">XLR 1 gain</option><option value="gain2">XLR 2 gain</option><option value="hp">Headphones 1 volume</option><option value="hp2">Headphones 2 volume</option><option value="auxLevel">Aux input level</option><option value="crossfade">Mic / PC monitor balance</option></optgroup></select><button id="add" class="primary">Add</button></div>
    <p class="hint">Rotate to adjust. The stack below is cycled with the selected gesture; the other gesture mutes or resets.</p>
  </section>
  <section class="card"><div class="section-title"><label>Dial stack</label><span id="stack-count" class="counter">0</span></div><ul id="stack" class="stack"></ul><p id="empty-stack" class="empty">Add at least one control.</p></section>
  <section class="card"><label>Cycle stack with</label><div class="segmented"><label><input type="radio" name="gesture" value="tap" checked><span>Screen tap</span></label><label><input type="radio" name="gesture" value="push"><span>Dial press</span></label></div></section>
  <script src="dial.js"></script>
</body></html>
