name: Release .deb

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dotnet-sdk-10.0

      - name: Run tests
        run: |
          dotnet build src/OpenXLR.slnx -c Release
          dotnet test src/OpenXLR.slnx -c Release --no-build

      - name: Build package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../openxlr_*.deb dist/

      - name: Lint package
        run: |
          sudo apt-get install -y --no-install-recommends lintian
          lintian dist/openxlr_*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: openxlr-deb
          path: dist/*.deb

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/*.deb
