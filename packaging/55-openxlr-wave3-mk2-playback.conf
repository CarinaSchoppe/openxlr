# Elgato Wave:3 MK.2 (0fd9:00ca): open its playback in float.
#
# The unit offers two playback formats: FLOAT_LE with three channels
# (FL FR FC, USB interface 2 altset 1) and S32_LE with two (altset 2), and
# captures FLOAT_LE on two channels. PipeWire picks the two-channel S32_LE
# format for its analog-stereo sink. On the maintainer's unit the
# microphone stalled as soon as that sink played: its capture stopped in
# the kernel, or ran and delivered a steady buzz at multiples of 187.5 Hz
# with no voice, and it stayed clean while the monitor played elsewhere.
# The likely reason is that the firmware expects float in both directions,
# as the Windows driver opens it. This rule asks for the float format, so
# both directions run the format the firmware is built around. Whether it
# cures the stall is to be confirmed on hardware: with the rule in place,
# /proc/asound/MK2/pcm0p/sub0/hw_params reads FLOAT_LE and 3 channels while
# the headphones play.
#
# The third channel is left unlinked by OpenXLR, which routes its mixes to
# FL and FR only; what the unit does with it is not known.
# The match is the MK.2's output nodes in every profile; its capture is
# held by 53-openxlr-wave3-capture-hold.conf.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\\.usb-Elgato_Elgato_Wave_3_MK\\.2_.*" }
    ]
    actions = {
      update-props = {
        audio.format = "F32LE"
        audio.channels = 3
        audio.position = "FL,FR,FC"
      }
    }
  }
]
