name: Release .deb

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dotnet-sdk-10.0 pkg-config libpipewire-0.3-dev liblilv-dev lv2-dev libx11-dev

      - name: Build package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../openxlr_*.deb dist/

      - name: Verify native helper is packaged and executable
        run: |
          dpkg-deb -x dist/openxlr_*.deb package-check
          test -x package-check/usr/lib/openxlr/daemon/openxlr-lv2-host

      - name: Lint package
        run: |
          sudo apt-get install -y --no-install-recommends lintian
          lintian dist/openxlr_*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: openxlr-deb
          path: dist/*.deb

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/*.deb
