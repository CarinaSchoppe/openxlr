# OpenXLR: readable names for the Wave XLR Pro's raw multichannel nodes.
#
# While the daemon drives the Pro, the card runs in the pro-audio profile
# and PipeWire exposes its raw 17-out / 18-in streams as one sink and one
# source called "Elgato Wave XLR Pro Multichannel", which system volume
# applets then list next to OpenXLR's virtual mixes. Nothing should be
# routed to them by hand (OpenXLR patches them internally), so name them
# for what they are. Display only: OpenXLR matches nodes by node.name,
# never by description.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\\.usb-Elgato_Elgato_Wave_XLR_Pro_.*multichannel-output" }
    ]
    actions = {
      update-props = {
        node.description = "Wave XLR Pro (raw, driven by OpenXLR)"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input\\.usb-Elgato_Elgato_Wave_XLR_Pro_.*multichannel-input" }
    ]
    actions = {
      update-props = {
        node.description = "Wave XLR Pro mic (raw, driven by OpenXLR)"
      }
    }
  }
]
