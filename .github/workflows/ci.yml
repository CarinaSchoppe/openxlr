name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        # Native hosting is built with the same strict flags locally and in CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libpipewire-0.3-dev liblilv-dev lv2-dev libx11-dev lsp-plugins-lv2
          dotnet restore src/OpenXLR.slnx

      - name: Build
        run: dotnet build src/OpenXLR.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/OpenXLR.slnx -c Release --no-build

      - name: Native audio regression (private servers, no hardware)
        run: |
          sudo apt-get install -y pipewire pipewire-pulse wireplumber pulseaudio-utils lsp-plugins-lv2 dbus xvfb xauth imagemagick bubblewrap
          xvfb-run -a python3 tools/verify-native-host.py --native-ui --screenshot native-compressor.png

      - name: Retain native UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-diagnostics
          path: native-compressor.png
          if-no-files-found: ignore

      - name: Validate Stream Deck/OpenDeck plugin
        run: |
          node --check plugin/com.emaspa.openxlr.sdPlugin/plugin.mjs
          python3 -m json.tool plugin/com.emaspa.openxlr.sdPlugin/manifest.json >/dev/null

      - name: Validate packaged service inputs
        run: |
          test -f packaging/openxlr-daemon.service
          test -f packaging/60-openxlr-pulse-limits.conf
          grep -q '^WatchdogSec=60$' packaging/openxlr-daemon.service
          grep -q '^LimitNOFILE=16384$' packaging/60-openxlr-pulse-limits.conf
          test -f packaging/70-openxlr.rules
          grep -q '0fd9' packaging/70-openxlr.rules
