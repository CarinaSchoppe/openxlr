# OpenXLR's control API listens on 127.0.0.1:37890, which sits inside the
# kernel's ephemeral port range (32768-60999). Without this line any local
# program opening an outgoing connection can be handed 37890 as its source
# port while the daemon is restarting, and the daemon then cannot bind.
# Reserving the port only removes it from automatic assignment; explicit
# binds still work.
net.ipv4.ip_local_reserved_ports = 37890
